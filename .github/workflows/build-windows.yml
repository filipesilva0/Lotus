name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # publishing a GitHub Release needs this

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Rust crates and npm packages must be on the same Tauri minor release
      - run: npm run check:tauri

      # Release builds (a pushed v* tag) also produce the signed updater files, but only when the
      # signing secrets exist. Without them this is the same plain build as before.
      - name: Prepare release config
        id: rel
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUB: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          $isTag = '${{ github.ref }}' -like 'refs/tags/v*'
          $upd = @{ endpoints = @('https://github.com/${{ github.repository }}/releases/latest/download/latest.json') }
          $conf = @{ plugins = @{ updater = $upd } }
          if ($env:KEY -and $env:PUB -and $isTag) {
            $conf.version = '${{ github.ref_name }}'.TrimStart('v')
            $conf.bundle  = @{ createUpdaterArtifacts = $true }
            $upd.pubkey   = $env:PUB
            'release=true' >> $env:GITHUB_OUTPUT
            Write-Host "Release build for $($conf.version)"
          } else {
            'release=false' >> $env:GITHUB_OUTPUT
            Write-Host 'Plain build: updater files are made only for a v* tag with TAURI_SIGNING_PRIVATE_KEY and TAURI_UPDATER_PUBKEY set.'
          }
          # Always point the build at this repository's releases (never the OWNER/REPO placeholder).
          $conf | ConvertTo-Json -Depth 8 | Set-Content ci-release.conf.json

      # Produces the .msi (WiX) in src-tauri/target/release/bundle/msi
      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build -- --verbose --config ci-release.conf.json

      # Only runs when the build fails: tauri hides light.exe's own error text, so run the linker
      # again by hand and print everything it says, and keep the rendered WiX files for inspection.
      - name: WiX diagnostics (on failure)
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $obj = Get-ChildItem src-tauri/target/release/wix -Recurse -Filter main.wixobj -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $obj) {
            Write-Host 'main.wixobj not found. Listing src-tauri/target/release:'
            Get-ChildItem src-tauri/target/release -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 80 | ForEach-Object { $_.FullName }
            exit 0
          }
          $dir = $obj.DirectoryName
          Write-Host "WiX work dir: $dir"
          Get-ChildItem $dir | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length)" }
          $wxl = Get-ChildItem $dir -Filter *.wxl | Select-Object -First 1
          Push-Location $dir
          Write-Host '=== light.exe output ==='
          $out = & "$env:LOCALAPPDATA\tauri\WixTools314\light.exe" -v -ext WixUIExtension -ext WixUtilExtension "-cultures:en-us" -loc $wxl.FullName -out "$dir\diag.msi" $obj.FullName 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          Write-Host "=== light.exe exit code: $code ==="
          # Second run with ICE validation skipped: tells us whether validation is what fails,
          # and leaves an UNVALIDATED msi in the artifact so the app itself can still be tried.
          Write-Host '=== light.exe -sval (ICE validation skipped) ==='
          $out2 = & "$env:LOCALAPPDATA\tauri\WixTools314\light.exe" -sval -ext WixUIExtension -ext WixUtilExtension "-cultures:en-us" -loc $wxl.FullName -out "$dir\unvalidated.msi" $obj.FullName 2>&1 | ForEach-Object { "$_" }
          $code2 = $LASTEXITCODE
          $out2 | ForEach-Object { Write-Host $_ }
          Write-Host "=== light.exe -sval exit code: $code2 ==="
          Pop-Location
          "light.exe normal exit $code ; with -sval exit $code2" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "::warning title=light.exe::normal run exit $code, -sval run exit $code2"
          # Keep the text next to the uploaded files, and surface it on the run page itself.
          $out | Set-Content -Path "$dir\light-output.txt"
          $hits = @($out | Where-Object { $_ -match 'error|ICE\d+|LGHT\d+|warning' } | Select-Object -First 25)
          foreach ($h in $hits) { Write-Host "::error title=light.exe::$h" }
          "### light.exe (exit $code)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          ($hits -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload WiX files (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wix-debug
          path: src-tauri/target/release/wix
          if-no-files-found: ignore

      - name: Package portable zip
        shell: pwsh
        run: ./scripts/package-portable.ps1

      # Publishes the GitHub Release that installed copies update from. It is created as a draft,
      # latest.json is attached, and only then is it published, so clients never see a release
      # without its update manifest.
      - name: Publish release
        if: steps.rel.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $ver = $tag.TrimStart('v')
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          $sig = "$($msi.FullName).sig"
          if (-not (Test-Path $sig)) { throw "Missing $sig: the updater files were not produced." }
          gh release create $tag $msi.FullName $sig dist-portable/Lotus-portable-x64.zip --draft --title "Lotus $ver" --generate-notes
          $notes = (gh release view $tag --json body | ConvertFrom-Json).body
          $manifest = @{
            version  = $ver
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{
              signature = (Get-Content $sig -Raw).Trim()
              url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$([uri]::EscapeDataString($msi.Name))"
            } }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content latest.json
          gh release upload $tag latest.json
          gh release edit $tag --draft=false

      - uses: actions/upload-artifact@v4
        with:
          name: Lotus-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            dist-portable/Lotus-portable-x64.zip
